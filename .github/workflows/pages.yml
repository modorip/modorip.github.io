name: Pages

# 법적 페이지(개인정보처리방침 · 지원)를 GitHub Pages 로 배포한다.
# 스토어에 제출하는 URL 이 여기서 나온다.
#
# 저장소는 공개다. 목업·설계 자료는 비공개 `modorip/admin` 으로 옮겼으므로
# 여기 남은 것은 전부 공개해도 되는 것들이다.
# main 에 반영되면 배포한다. 2026-08-08 에 저장소를 공개로 바꾸고 Pages 를
# 켜면서 이 트리거를 되살렸다.
#
# ⚠️ **여기서 나오는 URL 이 스토어에 제출된다.** 처리방침·지원 URL 이 그것이라
# 배포가 실패하면 심사자가 404 를 본다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 조직 사이트라 루트에 뜬다. basePath 를 주입하지 않는다.
      # ⚠️ 프로젝트 저장소로 옮기면 `/<repo>` 를 넣어야 한다.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
